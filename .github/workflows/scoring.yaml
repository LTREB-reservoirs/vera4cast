# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# Scoring must not overlap bundling: prep_scoring.R builds a DuckDB
# parquet_scan view whose file list is frozen at view creation, while
# bundle-forecasts.R rewrites/deletes data_0.parquet keys in place, which
# causes spurious "HTTP 404 Not Found / NoSuchKey" read errors mid-scan.
# Trigger scoring only after the bundling workflow completes successfully.
on:
  workflow_run:
    workflows: ["bundling"]
    types: [completed]
  workflow_dispatch:

name: scoring

jobs:
  docker:
    # workflow_dispatch has no workflow_run payload; allow manual runs too
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    #runs-on: self-hosted
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}
    container: rqthomas/vera-rocker:latest
    steps:

      - name: cleanup disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - uses: actions/checkout@v4

      - name: Install libuv
        shell: bash
        run: |
          apt-get update
          apt-get install -y libuv1 libuv1-dev

      - name: Install
        shell: Rscript {0}
        run: |
          remotes::install_deps(".", dep=TRUE)

      - name: install
        run: R -e "install.packages(c('bench', 'duckdbfs', 'minioclient', 'callr')); remotes::install_github('eco4cast/score4cast')"

      - name: scoring-prep
        run: r scoring/prep_scoring.R

      - name: scoring
        run: r scoring/scoring.R

      - name: Ping Healthchecks
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -m 10 --retry 5 https://hc-ping.com/931decf3-9674-4498-a2fc-938a4321ea2e
