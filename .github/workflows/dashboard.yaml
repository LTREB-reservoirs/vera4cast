on:
  #schedule:
  # - cron: '0 6 * * *'
  #push:
  #  branches:
  #    - main
  workflow_run: 
    workflows: ["scoring"]
    types: [completed]
  workflow_dispatch:

name: dashboard

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    container: rqthomas/vera-rocker:latest
    steps:
      - run: git config --system --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
           fetch-depth: 0
           set-safe-directory: '*'

      - name: Install libuv
        shell: bash
        run: |
          apt-get update
          apt-get install -y libuv1 libuv1-dev

      - name: install deps
        shell: Rscript {0}
        run: remotes::install_deps(".", dep=TRUE)

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.4.146

      - name: pull scores cache
        shell: Rscript {0}
        run: source("dashboard/cache.R")

      #- name: Cache scores
      #  id: cache-scores
      #  uses: actions/cache@v3
      #  with:
      #    path: cache
      #    key: ${{ runner.os }}-cache

      - name: Render
        run: |
          quarto render dashboard

      - name: Build site map
        shell: Rscript {0}
        run: |
         install.packages("RCurl")
         source("dashboard/build_site_map.R")

      - name: Publish
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout gh-pages
          cp -r dashboard/docs/* .
          git add .
          git commit -a -m "update pages" || echo "nothing to commit"
          git push https://${GITHUB_PAT}:${GITHUB_PAT}@github.com/${GITHUB_REPOSITORY}

      - name: Ping Healthchecks
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -m 10 --retry 5 https://hc-ping.com/bd7eb27f-ed50-496a-830c-ad7b3700bba9
